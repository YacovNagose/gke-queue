# In-cluster GKE deployment for the GPU Job Scheduler UI.
# Uses a dedicated ServiceAccount with least-privilege RBAC to submit/inspect
# demo Jobs in namespace 'default' and read GPU node labels.
#
# Security design: Exposed as a ClusterIP Service (NOT a public LoadBalancer)
# because this ServiceAccount can create GPU Jobs. Access it via IAM-authenticated
# port forwarding:
#   kubectl port-forward svc/gke-queue-ui 8000:80
# TODO(security): If exposing externally via Gateway/Ingress in the future,
# place Identity-Aware Proxy (IAP) or an OAuth2/OIDC proxy with TLS in front.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gke-queue-ui
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gke-queue-ui-role
  namespace: default
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gke-queue-ui-rolebinding
  namespace: default
subjects:
  - kind: ServiceAccount
    name: gke-queue-ui
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gke-queue-ui-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gke-queue-ui-node-reader
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gke-queue-ui-node-reader-binding
subjects:
  - kind: ServiceAccount
    name: gke-queue-ui
    namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gke-queue-ui-node-reader
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-queue-ui
  namespace: default
  labels:
    app.kubernetes.io/name: gke-queue-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gke-queue-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gke-queue-ui
    spec:
      serviceAccountName: gke-queue-ui
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ui
          image: gke-queue-ui:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # Bound inside the isolated Pod network namespace for ClusterIP and kubelet probes
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8000"
            - name: DEMO_CSRF_SECRET
              valueFrom:
                secretKeyRef:
                  name: gke-queue-ui-secret
                  key: csrf-secret
          readinessProbe:
            httpGet:
              path: /api/session
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/session
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gke-queue-ui
  namespace: default
  labels:
    app.kubernetes.io/name: gke-queue-ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gke-queue-ui
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
