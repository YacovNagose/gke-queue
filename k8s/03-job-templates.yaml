# Sample standalone Job templates for CLI testing with:
#   kubectl create -f k8s/03-job-templates.yaml
# Each job runs a small real PyTorch training loop that keeps the shared GPU
# ~25% busy (like a small model), so 4 jobs sharing one GPU push it toward ~100%.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: batch-sweep-
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: training-queue
    kueue.x-k8s.io/priority-class: low-priority
    demo.gke.io/job-type: batch-sweep
    demo.gke.io/priority-tier: low
  annotations:
    demo.gke.io/duration-seconds: "45"
spec:
  suspend: true
  parallelism: 1
  completions: 1
  backoffLimit: 1
  template:
    metadata:
      labels:
        demo.gke.io/job-type: batch-sweep
        demo.gke.io/priority-tier: low
    spec:
      restartPolicy: Never
      nodeSelector:
        cloud.google.com/compute-class: cheap-gpu-timeshared
      containers:
        - name: trainer
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command: ["python", "-u", "-c"]
          args:
            - |
              import os, time, torch
              dur = int(os.environ.get("DURATION_SECONDS", "45"))
              print(f"[JOB] {os.environ.get('JOB_TITLE')}", flush=True)
              dev = "cuda" if torch.cuda.is_available() else "cpu"
              print(f"[GPU] {torch.cuda.get_device_name(0) if dev == 'cuda' else 'not found, using CPU'}", flush=True)
              model = torch.nn.Sequential(
                  torch.nn.Linear(2048, 4096), torch.nn.ReLU(),
                  torch.nn.Linear(4096, 4096), torch.nn.ReLU(),
                  torch.nn.Linear(4096, 10),
              ).to(dev)
              opt = torch.optim.AdamW(model.parameters(), lr=1e-4)
              loss_fn = torch.nn.CrossEntropyLoss()
              teacher = torch.randn(2048, 10, device=dev)  # hidden rule the model has to learn
              start = time.time(); next_log = start + 5; epoch = 0
              while time.time() - start < dur:
                  t0 = time.time()
                  x = torch.randn(2048, 2048, device=dev)
                  y = (x @ teacher).argmax(dim=1)
                  opt.zero_grad(set_to_none=True)
                  loss = loss_fn(model(x), y)
                  loss.backward()
                  opt.step()
                  if dev == "cuda":
                      torch.cuda.synchronize()
                  time.sleep((time.time() - t0) * 3)
                  if time.time() >= next_log:
                      epoch += 1
                      print(f"[Epoch {epoch}] loss={loss.item():.4f} elapsed={int(time.time() - start)}s", flush=True)
                      next_log += 5
              print("[DONE] Training finished.", flush=True)
          env:
            - name: JOB_TITLE
              value: "Research Training Run (Small Model) - low-priority (100)"
            - name: DURATION_SECONDS
              value: "45"
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "1"
              memory: "4Gi"
              nvidia.com/gpu: "1"
---
apiVersion: batch/v1
kind: Job
metadata:
  generateName: critical-retrain-
  namespace: default
  labels:
