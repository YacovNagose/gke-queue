apiVersion: kueue.x-k8s.io/v1beta1
kind: ResourceFlavor
metadata:
  name: cheap-gpu-flavor
spec:
  nodeLabels:
    cloud.google.com/compute-class: cheap-gpu-timeshared
  tolerations:
    - key: cloud.google.com/compute-class
      operator: Equal
      value: cheap-gpu-timeshared
      effect: NoSchedule
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: critical-priority
value: 1000
description: "Critical production small-model retraining. Jumps to the front of the Kueue waiting queue."
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: WorkloadPriorityClass
metadata:
  name: low-priority
value: 100
description: "Low-priority batch hyperparameter sweeps and experimental small-model training."
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: gpu-cluster-queue
spec:
  namespaceSelector: {}
  queueingStrategy: BestEffortFIFO
  # Non-preemptive configuration: running low-priority training jobs are NEVER
  # killed mid-epoch so training progress is never wasted. Instead, waiting
  # critical-priority jobs jump to #1 in the queue and take the very next slot.
  preemption:
    withinClusterQueue: Never
    reclaimWithinCohort: Never
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: cheap-gpu-flavor
          resources:
            - name: "cpu"
              nominalQuota: 16
            - name: "memory"
              nominalQuota: 64Gi
            # 1 Physical GPU (L4 or T4) with maxSharedClientsPerGPU: 4
            # advertises 4 allocatable nvidia.com/gpu time-shared slices.
            - name: "nvidia.com/gpu"
              nominalQuota: 4
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: training-queue
  namespace: default
spec:
  clusterQueue: gpu-cluster-queue
